services:
  mysql:
    image: mysql:8.0
    container_name: wacdo-mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - wacdo-network

  backend:
    build:
      context: .
      dockerfile: ./wacdo/Dockerfile
    container_name: wacdo-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:mysql
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - wacdo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wacdo-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - wacdo-network

volumes:
  mysql_data:

networks:
  wacdo-network:
    driver: bridge